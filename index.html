    // ========================================================================
    // HELPER: EKSTRAK TEKS DARI FILE PDF MULTI-HALAMAN
    // ========================================================================
    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) {
        throw new Error('Pustaka pembaca PDF belum siap, silakan muat ulang halaman.');
      }
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = pdf.numPages;
      let fullText = '';

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageStrings = textContent.items.map((item) => item.str);
        fullText += `\n--- Halaman ${pageNum} ---\n` + pageStrings.join(' ');
      }

      return {
        text: fullText.trim(),
        numPages: totalPages
      };
    }

    // ========================================================================
    // HELPER: PANGGIL GEMINI API DENGAN RETRY & AUTO-FALLBACK MODEL TERBARU
    // ========================================================================
    async function fetchGeminiWithRetry(apiKey, payload, maxRetries = 2) {
      const candidateModels = [
        'gemini-3-flash-preview',
        'gemini-3.8-flash',
        'gemini-2.5-flash-lite'
      ];
      let lastError = new Error('Gagal menghubungi Gemini API');

      for (const modelName of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
        let delay = 800;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              const msg = errData?.error?.message || `HTTP ${response.status}`;
              if (response.status === 404 || msg.toLowerCase().includes('no longer available')) {
                lastError = new Error(msg);
                break;
              }
              if (response.status === 429 || response.status >= 500) {
                throw new Error(msg);
              }
              throw new Error(msg);
            }

            return await response.json();
          } catch (err) {
            lastError = err;
            if (attempt < maxRetries) {
              await new Promise((resolve) => setTimeout(resolve, delay));
              delay *= 2;
            }
          }
        }
      }

      throw lastError;
    }

    // ========================================================================

    function App() {
      // Penyimpanan Lokal (LocalStorage) agar paket soal & API Key tersimpan otomatis
      const [geminiApiKey, setGeminiApiKey] = useState(() => {
        return localStorage.getItem('juarakelas_gemini_key') || '';
      });
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [tempApiKey, setTempApiKey] = useState('');

      const [packages, setPackages] = useState(() => {
        try {
          const saved = localStorage.getItem('juarakelas_packages_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return [DEFAULT_BUILTIN_PACKAGE];
      });

      const [cloudConnected, setCloudConnected] = useState(false);
      const [isSyncingCloud, setIsSyncingCloud] = useState(false);

      const [xpStars, setXpStars] = useState(() => {
        return Number(localStorage.getItem('juarakelas_xp') || '150');
      });

      useEffect(() => {
        try {
          localStorage.setItem('juarakelas_packages_v1', JSON.stringify(packages));
        } catch (e) {}
      }, [packages]);

      // Sinkronisasi Real-Time dengan Firestore Cloud agar soal dari PC muncul di iPad
      useEffect(() => {
        if (!firestoreDb) return;

        let unsubscribe = () => {};
        try {
          unsubscribe = firestoreDb
            .collection('juarakelas_packages')
            .orderBy('createdAt', 'desc')
            .onSnapshot(
              (snapshot) => {
                setCloudConnected(true);
                const cloudList = [];
                snapshot.forEach((doc) => {
                  const data = doc.data();
                  if (data && Array.isArray(data.questions)) {
                    cloudList.push({
                      ...data,
                      id: data.id || doc.id
                    });
                  }
                });

                setPackages((prevLocal) => {
                  const mapById = new Map();
                  mapById.set(DEFAULT_BUILTIN_PACKAGE.id, DEFAULT_BUILTIN_PACKAGE);
                  prevLocal.forEach((p) => mapById.set(p.id, p));
                  cloudList.forEach((c) => mapById.set(c.id, c));

                  return Array.from(mapById.values()).sort(
                    (a, b) => (b.createdAt || 0) - (a.createdAt || 0)
                  );
                });
              },
              () => {
                setCloudConnected(false);
              }
            );
        } catch (e) {
          setCloudConnected(false);
        }

        return () => {
          try {
            unsubscribe();
          } catch (e) {}
        };
      }, []);

      const savePackageToCloud = async (pkgObj) => {
        setPackages((prev) => [pkgObj, ...prev.filter((p) => p.id !== pkgObj.id)]);
        if (!firestoreDb) return false;
        try {
          await firestoreDb.collection('juarakelas_packages').doc(pkgObj.id).set(pkgObj);
          return true;
        } catch (e) {
          return false;
        }
      };

      const deletePackageFromCloud = async (pkgId) => {
        setPackages((prev) => prev.filter((p) => p.id !== pkgId));
        if (!firestoreDb) return;
        try {
          await firestoreDb.collection('juarakelas_packages').doc(pkgId).delete();
        } catch (e) {}
      };

      // Dorong semua paket lokal (termasuk paket yang dibuat sebelum Cloud Sync aktif) ke Firestore
      const handlePushAllToCloud = async () => {
        if (!firestoreDb) {
          triggerToast('Firestore belum terhubung. Pastikan Firestore Database sudah dibuat di Firebase!', 'warning');
          return;
        }
        setIsSyncingCloud(true);
        let successCount = 0;
        let lastReason = '';

        for (const pkg of packages) {
          if (pkg.isBuiltin) continue;
          try {
            await firestoreDb.collection(CLOUD_COLLECTION).doc(pkg.id).set({
              ...pkg,
              updatedAt: Date.now()
            });
            successCount += 1;
          } catch (err) {
            lastReason = err?.message || 'Akses Firestore ditolak';
          }
        }

        setIsSyncingCloud(false);
        if (lastReason) {
          triggerToast(`Cloud gagal: ${lastReason}. Aktifkan Firestore Database (Test mode) di Firebase!`, 'warning');
        } else if (successCount > 0) {
          setCloudConnected(true);
          triggerToast(`${successCount} paket soal berhasil dikirim ke Cloud! Sekarang buka & refresh di iPad.`, 'success');
        } else {
          setCloudConnected(true);
          triggerToast('Cloud sudah tersinkron! Tidak ada paket tambahan baru untuk dikirim.', 'info');
        }
      };

      useEffect(() => {
        try {
          localStorage.setItem('juarakelas_packages_v1', JSON.stringify(packages));
        } catch (e) {}
      }, [packages]);

      // Sinkronisasi Real-Time Cloud Firestore agar soal dari PC langsung muncul di iPad
      useEffect(() => {
        if (!firestoreDb) return;
        const unsubscribe = firestoreDb
          .collection(CLOUD_COLLECTION)
          .onSnapshot(
            (snapshot) => {
              setCloudConnected(true);
              const cloudPkgs = [];
              snapshot.forEach((doc) => {
                const data = doc.data();
                if (data && data.id && Array.isArray(data.questions)) {
                  cloudPkgs.push(data);
                }
              });

              setPackages((prevLocal) => {
                const mapById = new Map();
                mapById.set(DEFAULT_BUILTIN_PACKAGE.id, DEFAULT_BUILTIN_PACKAGE);
                prevLocal.forEach((p) => {
                  if (p && p.id) mapById.set(p.id, p);
                });
                cloudPkgs.forEach((cp) => {
                  if (cp && cp.id) mapById.set(cp.id, cp);
                });

                const merged = Array.from(mapById.values());
                merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                return merged;
              });
            },
            () => {
              setCloudConnected(false);
            }
          );

        return () => unsubscribe();

        let successCount = 0;
        let lastReason = '';
        for (const pkg of customPkgs) {

          if (res.ok) {

          } else {

          triggerToast(

        setGenPgCount(7);
        setGenEssayCount(3);

        setUploadedPdfName('');
        setUploadedPdfPages(0);
        setKisiKisiText('');
        setGeneratorError('');
        setShowUploadModal(true);
      };

        if (!file) return;
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
          setGeneratorError('Mohon unggah file berformat PDF (.pdf) ya.');
          return;

        setIsExtractingPdf(true);
        setGeneratorError('');

        try {
          const { text, numPages } = await extractTextFromPdfFile(file);

            setGeneratorError(
              'Teks dalam PDF tidak terbaca (kemungkinan PDF berupa gambar hasil scan). Silakan pilih tab "Tempel Teks Manual".'

            setIsExtractingPdf(false);
            return;

          setUploadedPdfName(file.name);
          setUploadedPdfPages(numPages);
          setKisiKisiText(text);

            else if (lower.includes('matematika') || lower.includes('mtk')) setGenSubject('Matematika');
            else if (lower.includes('ipas') || lower.includes('ipa')) setGenSubject('IPAS');
            else if (lower.includes('indonesia')) setGenSubject('Bahasa Indonesia');
          }

          triggerToast(`Berhasil membaca ${numPages} halaman dari ${file.name}!`, 'success');

          setGeneratorError(`Gagal membaca file PDF: ${err?.message || 'Error tidak diketahui'}`);

          setIsExtractingPdf(false);

          setShowUploadModal(false);
          setShowApiKeyModal(true);
          return;

        const finalSubject = genSubject.trim() || 'Tematik / Umum';

        setIsGenerating(true);
        setGeneratorError('');

        const systemPrompt = `Kamu adalah Guru SD profesional di Indonesia dan pembuat soal edukatif bergaya ceria ramah anak seperti "Juara Kelas".
Tugasmu membuat paket soal latihan berdasarkan Kisi-Kisi PDF yang diberikan orang tua/guru.
Aturan wajib:
1. Buat tepat ${genPgCount} soal Pilihan Ganda (type: "pg") dan ${genEssayCount} soal Esai / Isian Singkat (type: "essay") sesuai indikator kisi-kisi.
2. Sesuaikan tingkat kesulitan kosakata dan kalimat dengan siswa Kelas ${genGrade} SD (Semester ${genSemester}).
3. Bahasa soal menyesuaikan mata pelajaran (jika Bahasa Inggris, pertanyaan & pilihan memakai Bahasa Inggris level SD yang ramah anak, tetapi "explanation" dan "trapWarning" wajib dalam Bahasa Indonesia yang ceria, jelas, dan mudah dipahami anak SD).
4. Jika soal membutuhkan ilustrasi/gambar, isi field "visualEmoji" dengan rangkaian emoji kontekstual yang jelas dan "visualCaption" dengan keterangan gambar singkat agar siswa bisa menjawab tanpa gambar eksternal. Jika tidak butuh ilustrasi, isi string kosong "".
5. Untuk soal Pilihan Ganda ("pg"), sediakan tepat 4 opsi ("A", "B", "C", "D") dan tentukan "correctAnswer" ("A", "B", "C", atau "D").
6. Untuk soal Esai ("essay"), kosongkan array "options" ([]), isi "correctAnswer" dan "sampleAnswer" dengan kunci jawaban singkat yang benar.
7. Field "explanation" wajib berisi pembahasan langkah demi langkah ramah anak ("Langkah 1: ... Langkah 2: ...").
8. Field "trapWarning" wajib berisi tips peringatan kesalahan umum yang sering menjebak siswa.`;

        const userQuery = `Mata Pelajaran: ${finalSubject}
Jenjang: Kelas ${genGrade} SD - Semester ${genSemester}
Jumlah Pilihan Ganda: ${genPgCount}
Jumlah Esai / Isian: ${genEssayCount}

ISI KISI-KISI DARI PDF:
${kisiKisiText.slice(0, 28000)}`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                questions: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      type: { type: 'STRING', enum: ['pg', 'essay'] },
                      unit: { type: 'STRING' },
                      visualEmoji: { type: 'STRING' },
                      visualCaption: { type: 'STRING' },
                      question: { type: 'STRING' },
                      options: {
                        type: 'ARRAY',
                        items: {
                          type: 'OBJECT',
                          properties: {
                            key: { type: 'STRING' },
                            text: { type: 'STRING' }
                          },
                          required: ['key', 'text']
                        }
                      },
                      correctAnswer: { type: 'STRING' },
                      sampleAnswer: { type: 'STRING' },
                      explanation: { type: 'STRING' },
                      trapWarning: { type: 'STRING' }
                    },
                    required: [
                      'id',
                      'type',
                      'unit',
                      'visualEmoji',
                      'visualCaption',
                      'question',
                      'options',
                      'correctAnswer',
                      'explanation',
                      'trapWarning'
                    ]
                  }
                }
              },
              required: ['questions']
            }
          }
        };

        try {
          const result = await fetchGeminiWithRetry(geminiApiKey, payload);
          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('Respons dari Gemini kosong.');

          const parsed = JSON.parse(rawText);
          if (!parsed.questions || parsed.questions.length === 0) {
            throw new Error('Soal belum berhasil dibuat.');
          }

          const normalizedQuestions = parsed.questions.map((q, idx) => ({
            ...q,
            id: `q_${Date.now()}_${idx + 1}`
          }));

          const newPackageObj = {
            id: `pkg_kls${genGrade}_sem${genSemester}_${Date.now()}`,
            isBuiltin: false,
            grade: Number(genGrade),
            semester: Number(genSemester),
            subject: finalSubject,
            title: finalTitle,
            sourcePdfName: uploadedPdfName || 'Input Kisi-Kisi Manual',
            createdAt: Date.now(),
            bestScore: null,
            questions: normalizedQuestions
          };

          await savePackageToCloud(newPackageObj);
          setSelectedGrade(Number(genGrade));
          setSelectedSemester(Number(genSemester));
          setShowUploadModal(false);
          setActiveView('library');

          triggerToast(
            `Hore! Paket soal tersimpan di Cloud & Kelas ${genGrade} • Semester ${genSemester}!`,
            'success'
          );
        } catch (err) {
          setGeneratorError(
            `Gagal membuat soal: ${err.message}. Pastikan Gemini API Key kamu benar dan aktif ya.`
          );
        } finally {
          setIsGenerating(false);
        }
      };

      const handleFinalizeAndGradeExam = async () => {
        setShowSubmitConfirm(false);
        setIsTimerRunning(false);
        setIsGrading(true);

        const diffSecs = Math.max(1, Math.round((Date.now() - quizStartTime) / 1000));
        const mins = Math.floor(diffSecs / 60);
        const secs = diffSecs % 60;
        setElapsedDurationText(`${mins} menit ${secs} detik`);

        const essayQuestions = activePackage.questions.filter((q) => q.type === 'essay');
        let aiEssayEvaluations = {};

        if (essayQuestions.length > 0 && geminiApiKey) {
          try {
            const essayPayloadList = essayQuestions.map((q) => ({
              id: q.id,
              question: q.question,
              expectedAnswer: q.sampleAnswer || q.correctAnswer,
              studentAnswer: (answers[q.id] || '').trim() || '(Tidak dijawab)'
            }));

            const systemPrompt = `Kamu adalah guru SD yang ramah, bijaksana, dan sangat menyemangati anak-anak.
Tugasmu menilai jawaban Esai / Isian Singkat siswa Kelas ${activePackage.grade} SD (mapel ${activePackage.subject}).
Aturan penilaian fleksibel:
- Jangan menghukum kesalahan kecil pada huruf kapital atau tanda baca titik/koma.
- Berikan skor 100 jika jawaban benar/sesuai makna kunci jawaban.
- Berikan skor 50 sampai 85 jika jawaban hampir benar atau sebagian benar.
- Berikan skor 0 jika jawaban salah jauh atau tidak dijawab.
- Tulis "feedback" singkat dalam Bahasa Indonesia yang ramah anak (maksimal 2 kalimat).`;

            const payload = {
              contents: [
                {
                  parts: [
                    {
                      text: `Evaluasi jawaban esai siswa SD berikut ini:\n${JSON.stringify(
                        essayPayloadList,
                        null,
                        2
                      )}`
                    }
                  ]
                }
              ],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      score: { type: 'NUMBER' },
                      isCorrect: { type: 'BOOLEAN' },
                      feedback: { type: 'STRING' }
                    },
                    required: ['id', 'score', 'isCorrect', 'feedback']
                  }
                }
              }
            };

            const result = await fetchGeminiWithRetry(geminiApiKey, payload);
            const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              const parsedArray = JSON.parse(rawText);
              parsedArray.forEach((item) => {
                aiEssayEvaluations[item.id] = item;
              });
            }
          } catch (err) {}
        }

        // Fallback tolerant grading jika API Key belum dipasang atau offline
        essayQuestions.forEach((q) => {
          if (!aiEssayEvaluations[q.id]) {
            const cleanUser = (answers[q.id] || '').trim().toLowerCase().replace(/[.!?,]/g, '');
            const cleanExpected = (q.sampleAnswer || q.correctAnswer || '')
              .trim()
              .toLowerCase()
              .replace(/[.!?,]/g, '');

            const isExact = cleanUser.length > 0 && cleanUser === cleanExpected;
            const isPartial =
              cleanUser.length > 0 &&
              !isExact &&
              (cleanExpected.includes(cleanUser) || cleanUser.includes(cleanExpected));

            aiEssayEvaluations[q.id] = {
              id: q.id,
              score: isExact ? 100 : isPartial ? 70 : 0,
              isCorrect: isExact || isPartial,
              feedback: isExact
                ? 'Hebat sekali! Jawabanmu tepat dan sesuai dengan kunci jawaban!'
                : isPartial
                ? 'Hampir sempurna! Kamu sudah menuliskan kata kuncinya, cek susunan lengkapnya di pembahasan ya.'
                : 'Belum tepat, yuk baca pembahasan langkah demi langkah di bawah supaya makin paham!'
            };
          }
        });

        let accumulatedScore = 0;
        let correctCount = 0;

        const evaluatedItems = activePackage.questions.map((q, index) => {
          const userAns = (answers[q.id] || '').trim();
          if (q.type === 'pg') {
            const isCorrect = userAns.toUpperCase() === q.correctAnswer.toUpperCase();
            const itemScore = isCorrect ? 100 : 0;
            accumulatedScore += itemScore;
            if (isCorrect) correctCount += 1;

            const selectedOptObj = q.options.find((o) => o.key === userAns);
            const correctOptObj = q.options.find((o) => o.key === q.correctAnswer);

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: selectedOptObj
                ? `${selectedOptObj.key}. ${selectedOptObj.text}`
                : '(Belum dijawab)',
              correctAnswerDisplay: correctOptObj
                ? `${correctOptObj.key}. ${correctOptObj.text}`
                : q.correctAnswer,
              isCorrect,
              score: itemScore,
              aiFeedback: null
            };
          } else {
            const aiEval = aiEssayEvaluations[q.id];
            accumulatedScore += aiEval.score;
            if (aiEval.score >= 70) correctCount += 1;

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: userAns || '(Belum dijawab)',
              correctAnswerDisplay: q.sampleAnswer || q.correctAnswer,
              isCorrect: aiEval.score >= 70,
              score: aiEval.score,
              aiFeedback: aiEval.feedback
            };
          }
        });

        const finalScore = Math.round(accumulatedScore / activePackage.questions.length);
        const earnedStars = Math.max(10, Math.round(finalScore / 2));
        setXpStars((prev) => prev + earnedStars);

        const prevBest = activePackage.bestScore ?? -1;
        if (finalScore > prevBest) {
          const updatedPkg = { ...activePackage, bestScore: finalScore };
          setActivePackage(updatedPkg);
          await savePackageToCloud(updatedPkg);
        }

        setGradingResults({
          finalScore,
          correctCount,
          totalQuestions: activePackage.questions.length,
          earnedStars,
          items: evaluatedItems
        });

        setIsGrading(false);
        setActiveView('results');
      };

      const filteredPackages = packages.filter(
        (pkg) => Number(pkg.grade) === selectedGrade && Number(pkg.semester) === selectedSemester
      );

      const currentQuestion = activePackage.questions[currentIdx] || activePackage.questions[0];
      const answeredCount = activePackage.questions.filter(
        (q) => answers[q.id] && answers[q.id].trim().length > 0
      ).length;
      const unsureCount = activePackage.questions.filter((q) => unsureFlags[q.id]).length;

      const getStarCount = (score) => {

        if (score >= 75) return 4;
        if (score >= 60) return 3;
        if (score >= 40) return 2;
        return 1;

        return 'Tetap Semangat! Yuk Pelajari Pembahasannya Bersama-sama! 🚀📚';
      };

              </button>

              <div className="flex flex-wrap items-center gap-2">

                ) : (
                  <>
                    <button

                      className="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-sm shadow-lg"
                    >
                      {isGenerating ? '⏳ Meracik Soal...' : '✨ Generate & Simpan Soal'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL KONFIRMASI HAPUS */}
          {packageToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 border-2 border-rose-100 shadow-2xl text-center">
                <h3 className="text-lg font-extrabold text-slate-900 mb-2">Hapus Paket Soal Ini?</h3>
                <p className="text-sm text-slate-600 mb-5">
                  Paket <strong>"{packageToDelete.title}"</strong> akan dihapus.
                </p>
                <div className="flex gap-3">
                  <button
                    type="button"
                    onClick={() => setPackageToDelete(null)}
                    className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={async () => {
                      await deletePackageFromCloud(packageToDelete.id);
                      setPackageToDelete(null);
                      triggerToast('Paket soal dihapus dari cloud.', 'info');
                    }}
                    className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-sm"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL KONFIRMASI KUMPULKAN */}
          {showSubmitConfirm && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 border-2 border-sky-100 shadow-2xl text-center">
                <div className="text-4xl mb-3">✅</div>
                <h3 className="text-xl font-extrabold text-slate-900 mb-2">
                  Sudah Yakin Ingin Mengumpulkan?
                </h3>
                <p className="text-sm text-slate-600 mb-5 leading-relaxed">
                  Kamu sudah menjawab <strong>{answeredCount}</strong> dari{' '}
                  <strong>{activePackage.questions.length}</strong> soal
                  {unsureCount > 0 ? ` (masih ada ${unsureCount} soal ditandai ragu-ragu)` : ''}.
                  Yuk cek hasilnya sekarang!
                </p>
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setShowSubmitConfirm(false)}
                    className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm text-slate-700 hover:bg-slate-100"
                  >
                    Cek Lagi
                  </button>
                  <button
                    type="button"
                    onClick={handleFinalizeAndGradeExam}
                    className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md"
                  >
                    Ya, Kumpulkan!
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LOADING OVERLAY SAAT MENGOREKSI */}
          {isGrading && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-7 border-2 border-indigo-100 shadow-2xl text-center">
                <div className="text-4xl animate-spin mb-4">⏳</div>
                <h3 className="text-lg font-extrabold text-slate-900 mb-1.5">
                  Sebentar Ya, Sedang Mengoreksi...
                </h3>
                <p className="text-sm text-slate-600">
                  Kakak AI sedang memeriksa jawaban Pilihan Ganda dan Esaimu dengan teliti! ✨
                </p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
