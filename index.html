    // =========================================================================
    // HELPER: EKSTRAK TEKS DARI FILE PDF
    // =========================================================================
    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) {
        throw new Error('Library pembaca PDF belum termuat. Periksa koneksi internet.');
      }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = pdf.numPages;
      let fullText = '';

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageStrings = textContent.items.map((item) => item.str);
        fullText += `\n--- Halaman ${pageNum} ---\n` + pageStrings.join(' ');
      }

      return {
        text: fullText.trim(),
        numPages: totalPages
      };
    }

    // =========================================================================
    // HELPER: CALL GEMINI API DENGAN AUTO-FALLBACK MODEL TERCEPAT
    // =========================================================================
    async function fetchGeminiWithRetry(apiKey, payload, maxRetries = 2) {
      const candidateModels = [
        'gemini-2.5-flash',
        'gemini-3-flash-preview'
      ];

      let lastError = null;

      for (const modelName of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
        let delay = 800;

        const tunedPayload = modelName.startsWith('gemini-2.5')
          ? {
              ...payload,
              generationConfig: {
                ...(payload.generationConfig || {}),
                thinkingConfig: { thinkingBudget: 0 }
              }
            }
          : payload;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(tunedPayload)
            });

            if (!response.ok) {
              if (response.status === 404 || response.status === 400) {
                const errJson = await response.json().catch(() => ({}));
                lastError = new Error(errJson?.error?.message || `Model ${modelName} tidak tersedia (${response.status})`);
                break;
              }
              if (response.status === 429 || response.status >= 500) {
                throw new Error(`HTTP ${response.status}`);
              }
              const errJson = await response.json().catch(() => ({}));
              const errMsg = errJson?.error?.message || `API Error (${response.status})`;
              throw new Error(errMsg);
            }

            return await response.json();
          } catch (err) {
            lastError = err;
            if (attempt === maxRetries) break;
            await new Promise((resolve) => setTimeout(resolve, delay));
            delay *= 2;
          }
        }
      }

      throw lastError || new Error('Gagal menghubungi server Gemini.');
    }

    function normalizeNumberText(raw) {
      if (!raw) return '';
      let cleaned = String(raw)
        .toLowerCase()
        .replace(/[.!?,;:'"()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      if (NUMBER_WORD_TO_DIGIT[cleaned] !== undefined) {
        return NUMBER_WORD_TO_DIGIT[cleaned];
      }

      // Jika hanya satu kata/angka (misal "Enam" atau "6"), langsung kembalikan nilainya
      if (!cleaned.includes(' ') && NUMBER_WORD_TO_DIGIT[cleaned] !== undefined) {
        return NUMBER_WORD_TO_DIGIT[cleaned];
      }

      // Ganti kata bilangan yang berdiri sendiri di dalam kalimat menjadi digitnya
      const tokens = cleaned.split(' ').map((tok) => {
        return NUMBER_WORD_TO_DIGIT[tok] !== undefined ? NUMBER_WORD_TO_DIGIT[tok] : tok;
      });
      return tokens.join(' ').trim();
    }

    function isEquivalentEssayAnswer(userRaw, expectedRaw) {
      const uNorm = normalizeNumberText(userRaw);
      const eNorm = normalizeNumberText(expectedRaw);
      if (!uNorm || !eNorm) return false;
      if (uNorm === eNorm) return true;

      // Jika jawaban user adalah angka/kata bilangan tunggal (misal "6" / "enam")
      // dan kunci jawabannya memuat angka yang sama diikuti satuan (misal "6 bola")
      const uTokens = uNorm.split(' ');
      const eTokens = eNorm.split(' ');
      if (uTokens.length === 1 && eTokens.includes(uTokens[0])) {
        return true;
      }
      if (eTokens.length === 1 && uTokens.includes(eTokens[0])) {
        return true;
      }

      return false;
    }

        const simplifiedReference = pkg.questions.map((q, i) => ({
          no: i + 1,

        }));

        const payload = {
          contents: [

              parts: [

                  text: `Mata Pelajaran: ${pkg.subject}\nKelas: ${pkg.grade} SD Semester ${pkg.semester}\nReferensi Indikator Soal Sebelumnya:\n${JSON.stringify(

                    2

          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                questions: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      type: { type: 'STRING', enum: ['pg', 'essay'] },

            if (lower.includes('english') || lower.includes('inggris')) setGenSubject('Bahasa Inggris');
            else if (lower.includes('matematika') || lower.includes('mtk')) setGenSubject('Matematika');
            else if (lower.includes('ipas') || lower.includes('ipa')) setGenSubject('IPAS');
            else if (lower.includes('indonesia')) setGenSubject('Bahasa Indonesia');
            else if (lower.includes('pai') || lower.includes('agama') || lower.includes('quran'))
              setGenSubject('Pendidikan Agama Islam');
            else if (lower.includes('pancasila') || lower.includes('ppkn'))
              setGenSubject('Pendidikan Pancasila');
          }

          triggerToast(`Berhasil membaca ${numPages} halaman dari ${file.name}!`, 'success');
        } catch (err) {
          setGeneratorError(`Gagal membaca file PDF: ${err.message}`);
        } finally {
          setIsExtractingPdf(false);
        }
      };

      const handleGenerateAndSavePackage = async (e) => {
        if (e) e.preventDefault();
        if (!geminiApiKey) {
          setGeneratorError(
            'Kamu belum memasukkan Gemini API Key. Klik tombol "Admin" di pojok kanan atas untuk menempelkan API Key dari Google AI Studio.'
          );
          return;
        }
        if (!kisiKisiText.trim()) {
          setGeneratorError('Silakan unggah file PDF kisi-kisi atau tempel teks kisi-kisi terlebih dahulu.');
          return;
        }

        const finalSubject = genSubject.trim() || 'Tematik / Umum';
        const finalTitle =
          genTitle.trim() || `Latihan ${finalSubject} - Kelas ${genGrade} Semester ${genSemester}`;
        const safePgCount = Math.min(20, Math.max(1, parseInt(genPgCount, 10) || 7));
        const safeEssayCount = Math.min(15, Math.max(0, parseInt(genEssayCount, 10) || 0));

        setIsGenerating(true);
        setGeneratorError('');

        const systemPrompt = `Kamu adalah Guru SD profesional di Indonesia untuk aplikasi "Juara Kelas".
Buat tepat ${safePgCount} soal Pilihan Ganda (type: "pg") dan ${safeEssayCount} soal Esai / Isian Singkat (type: "essay") sesuai indikator kisi-kisi untuk Kelas ${genGrade} SD (Semester ${genSemester}).
- Untuk Pilihan Ganda ("pg"), isi 4 opsi ("A", "B", "C", "D") dan tentukan "correctAnswer".
- Untuk Esai ("essay"), kosongkan array "options" ([]), isi "correctAnswer" dan "sampleAnswer".
- Field "explanation" (pembahasan singkat & jelas maksimal 2-3 kalimat) dan "trapWarning" (tips singkat maksimal 1-2 kalimat) wajib ramah anak dalam Bahasa Indonesia.`;

        const userQuery = `Mata Pelajaran: ${finalSubject}\nJenjang: Kelas ${genGrade} SD - Semester ${genSemester}\n\nISI KISI-KISI:\n${kisiKisiText.slice(0, 18000)}`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                questions: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      type: { type: 'STRING', enum: ['pg', 'essay'] },
                      unit: { type: 'STRING' },
                      visualEmoji: { type: 'STRING' },
                      visualCaption: { type: 'STRING' },
                      question: { type: 'STRING' },
                      options: {
                        type: 'ARRAY',
                        items: {
                          type: 'OBJECT',
                          properties: {
                            key: { type: 'STRING' },
                            text: { type: 'STRING' }
                          },
                          required: ['key', 'text']
                        }
                      },
                      correctAnswer: { type: 'STRING' },
                      sampleAnswer: { type: 'STRING' },
                      explanation: { type: 'STRING' },
                      trapWarning: { type: 'STRING' }
                    },
                    required: [
                      'id',
                      'type',
                      'unit',
                      'visualEmoji',
                      'visualCaption',
                      'question',
                      'options',
                      'correctAnswer',
                      'explanation',
                      'trapWarning'
                    ]
                  }
                }
              },
              required: ['questions']
            }
          }
        };

        try {
          const result = await fetchGeminiWithRetry(geminiApiKey, payload);
          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('Respons dari Gemini kosong.');

          const parsed = JSON.parse(rawText);
          const normalizedQuestions = parsed.questions.map((q, idx) => ({
            ...q,
            id: `q_${Date.now()}_${idx + 1}`
          }));

          // ID unik dengan timestamp + random suffix agar generate berulang tidak pernah menimpa paket sebelumnya
          const uniqueSuffix = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
          const newPackageObj = {
            id: `pkg_kls${genGrade}_sem${genSemester}_${uniqueSuffix}`,
            isBuiltin: false,
            grade: Number(genGrade),
            semester: Number(genSemester),
            subject: finalSubject,
            title: finalTitle,
            sourcePdfName: uploadedPdfName || 'Input Kisi-Kisi Manual',
            createdAt: Date.now(),
            bestScore: null,
            questions: normalizedQuestions
          };

          setPackages((prev) => {
            const nextList = [newPackageObj, ...prev];
            try {
              localStorage.setItem('jk_packages_v2', JSON.stringify(nextList));
            } catch (err) {}
            return nextList;
          });
          const syncRes = await savePackageToCloud(newPackageObj);

          setSelectedGrade(Number(genGrade));
          setSelectedSemester(Number(genSemester));
          setShowUploadModal(false);
          navigateToView('library');

          if (syncRes.ok) {
            triggerToast(
              `Hore! Paket soal tersimpan & otomatis tersinkron ke Cloud iPad!`,
              'success'
            );
          } else {
            triggerToast(
              `Paket soal tersimpan di PC! (Cloud belum sinkron: ${syncRes.reason})`,
              'warning'
            );
          }
        } catch (err) {
          setGeneratorError(
            `Gagal membuat soal: ${err.message}. Pastikan Gemini API Key kamu benar dan aktif ya.`
          );
        } finally {
          setIsGenerating(false);
        }
      };

      const handleConfirmDeletePackage = async () => {
        if (!packageToDelete || !isAdminUnlocked) return;
        const targetId = packageToDelete.id;
        setPackageToDelete(null);

        setPackages((prev) => prev.filter((p) => p.id !== targetId));
        await deletePackageFromCloud(targetId);
        triggerToast('Paket soal berhasil dihapus dari perangkat & Cloud.', 'info');
      };

      const handleFinalizeAndGradeExam = async () => {
        setShowSubmitConfirm(false);
        setIsTimerRunning(false);
        setIsGrading(true);

        const diffSecs = Math.max(1, Math.round((Date.now() - quizStartTime) / 1000));
        setElapsedDurationText(`${Math.floor(diffSecs / 60)} menit ${diffSecs % 60} detik`);

        const essayQuestions = activePackage.questions.filter((q) => q.type === 'essay');
        let aiEssayEvaluations = {};

        if (essayQuestions.length > 0 && geminiApiKey) {
          try {
            const essayPayloadList = essayQuestions.map((q) => ({
              id: q.id,
              question: q.question,
              expectedAnswer: q.sampleAnswer || q.correctAnswer,
              studentAnswer: (answers[q.id] || '').trim() || '(Tidak dijawab)'
            }));

            const payload = {
              contents: [
                {
                  parts: [
                    {
                      text: `Evaluasi jawaban esai siswa Kelas ${activePackage.grade} SD berikut ini:\n${JSON.stringify(
                        essayPayloadList
                      )}`
                    }
                  ]
                }
              ],
              systemInstruction: {
                parts: [
                  {
                    text: 'Kamu adalah guru SD yang ramah, bijaksana, dan sangat menyemangati anak-anak. Nilai jawaban esai siswa secara adil: jika jawaban hanya berbeda penulisan antara angka dan huruf/kata bilangan (misalnya "6" dan "enam", "six" dan "6", "10" dan "sepuluh", atau beda kapitalisasi/tanda baca), WAJIB beri nilai BENAR penuh (skor 100). Beri skor 50-85 jika sebagian benar, 0 jika salah. Tulis feedback singkat ramah anak dalam Bahasa Indonesia.'
                  }
                ]
              },
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      score: { type: 'NUMBER' },
                      isCorrect: { type: 'BOOLEAN' },
                      feedback: { type: 'STRING' }
                    },
                    required: ['id', 'score', 'isCorrect', 'feedback']
                  }
                }
              }
            };

            const result = await fetchGeminiWithRetry(geminiApiKey, payload);
            const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              JSON.parse(rawText).forEach((item) => {
                aiEssayEvaluations[item.id] = item;
              });
            }
          } catch (e) {}
        }

        essayQuestions.forEach((q) => {
          if (!aiEssayEvaluations[q.id]) {
            const rawUser = (answers[q.id] || '').trim();
            const rawExpected = (q.sampleAnswer || q.correctAnswer || '').trim();
            const cleanUser = rawUser.toLowerCase().replace(/[.!?,]/g, '');
            const cleanExpected = rawExpected.toLowerCase().replace(/[.!?,]/g, '');
            const isNumberMatch = isEquivalentEssayAnswer(rawUser, rawExpected);
            const isExact = isNumberMatch || (cleanUser.length > 0 && cleanUser === cleanExpected);
            const isPartial =
              !isExact &&
              cleanUser.length > 0 &&
              (cleanExpected.includes(cleanUser) || cleanUser.includes(cleanExpected));

            aiEssayEvaluations[q.id] = {
              id: q.id,
              score: isExact ? 100 : isPartial ? 70 : 0,
              isCorrect: isExact || isPartial,
              feedback: isExact
                ? 'Hebat sekali! Jawabanmu tepat dan sesuai dengan kunci jawaban!'
                : isPartial
                ? 'Hampir sempurna! Cek susunan lengkapnya di pembahasan ya.'
                : 'Belum tepat, yuk baca pembahasan langkah demi langkah di bawah!'
            };
          } else {
            const rawUser = (answers[q.id] || '').trim();
            const rawExpected = (q.sampleAnswer || q.correctAnswer || '').trim();
            if (isEquivalentEssayAnswer(rawUser, rawExpected)) {
              aiEssayEvaluations[q.id] = {
                ...aiEssayEvaluations[q.id],
                score: 100,
                isCorrect: true,
                feedback: 'Hebat sekali! Jawabanmu tepat (angka & huruf bernilai sama)!'
              };
            }
          }
        });

        let accumulatedScore = 0;
        let correctCount = 0;

        const evaluatedItems = activePackage.questions.map((q, index) => {
          const userAns = (answers[q.id] || '').trim();
          if (q.type === 'pg') {
            const isCorrect = userAns.toUpperCase() === q.correctAnswer.toUpperCase();
            const itemScore = isCorrect ? 100 : 0;
            accumulatedScore += itemScore;
            if (isCorrect) correctCount += 1;

            const selectedOptObj = q.options.find((o) => o.key === userAns);
            const correctOptObj = q.options.find((o) => o.key === q.correctAnswer);

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: selectedOptObj
                ? `${selectedOptObj.key}. ${selectedOptObj.text}`
                : '(Belum dijawab)',
              correctAnswerDisplay: correctOptObj
                ? `${correctOptObj.key}. ${correctOptObj.text}`
                : q.correctAnswer,
              isCorrect,
              score: itemScore,
              aiFeedback: null
            };
          } else {
            const aiEval = aiEssayEvaluations[q.id];
            accumulatedScore += aiEval.score;
            if (aiEval.score >= 70) correctCount += 1;

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: userAns || '(Belum dijawab)',
              correctAnswerDisplay: q.sampleAnswer || q.correctAnswer,
              isCorrect: aiEval.score >= 70,
              score: aiEval.score,
              aiFeedback: aiEval.feedback
            };
          }
        });

        const finalScore = Math.round(accumulatedScore / activePackage.questions.length);
        const earnedStars = Math.max(10, Math.round(finalScore / 2));
        setXpStars((prev) => prev + earnedStars);

        const basePkg = packages.find((p) => p.id === activePackage.id) || activePackage;
        const prevBest = basePkg.bestScore ?? -1;
        if (finalScore > prevBest) {
          const updatedPkg = { ...basePkg, bestScore: finalScore };
          setPackages((prev) => prev.map((p) => (p.id === basePkg.id ? updatedPkg : p)));
          await savePackageToCloud(updatedPkg);
        }

        setGradingResults({
          finalScore,
          correctCount,
          totalQuestions: activePackage.questions.length,
          earnedStars,
          items: evaluatedItems
        });

        setIsGrading(false);
        navigateToView('results');
      };

      const filteredPackages = packages.filter(
        (pkg) => Number(pkg.grade) === selectedGrade && Number(pkg.semester) === selectedSemester
      );

      const currentQuestion = activePackage.questions[currentIdx] || activePackage.questions[0];
      const answeredCount = activePackage.questions.filter(
        (q) => answers[q.id] && answers[q.id].trim().length > 0
      ).length;
      const unsureCount = activePackage.questions.filter((q) => unsureFlags[q.id]).length;

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div className="pb-12">
            {/* HEADER */}
            <header className="sticky top-0 z-30 bg-[#1a1c42]/95 border-b border-white/10 shadow-lg">
              <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
                <button
                  onClick={() => {
                    setIsTimerRunning(false);
                    navigateToView('library');
                  }}
                  className="flex items-center gap-3 text-left group"
                >
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xl shadow-md">
                    🎓
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-lg sm:text-xl font-extrabold tracking-tight text-white">
                        Juara <span className="text-amber-300">Kelas</span>
                      </h1>
                      <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-400/20 text-amber-300 border border-amber-300/30">
                        ⭐ {xpStars} XP
                      </span>
                    </div>
                    <p className="text-xs font-semibold text-indigo-200">
                      {activeView === 'library'
                        ? 'Bank Soal & Kisi-Kisi Pintar Kelas 1 – 6 SD'
                        : `Kelas ${activePackage.grade} • Semester ${activePackage.semester} • ${activePackage.subject}`}
                    </p>
                  </div>
                </button>

                <div className="flex flex-wrap items-center gap-2">
                  {activeView === 'quiz' ? (
                    <>
                      <button
                        onClick={() => {
                          setIsTimerRunning(false);
                          navigateToView('library');
                        }}
                        className="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/10 hover:bg-white/20 text-white border border-white/15"
                      >
                        ← Daftar Paket
                      </button>
                      <button
                        onClick={handleToggleTimerMode}
                        className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border ${
                          timerEnabled
                            ? 'bg-rose-500/20 border-rose-400/40 text-rose-200'
                            : 'bg-emerald-500/20 border-emerald-400/40 text-emerald-200'
                        }`}
                      >
                        {timerEnabled ? `⏱️ ${formatTime(timeLeftSeconds)}` : '🌱 Mode Santai'}
                      </button>
                    </>
                  ) : (
                    <>
                      {isAdminUnlocked && (
                        <button
                          type="button"
                          onClick={handleManualSyncAllToCloud}
                          className={`px-3 py-2 rounded-xl text-xs font-extrabold border flex items-center gap-1.5 ${
                            cloudSyncStatus === 'synced'
                              ? 'bg-emerald-500/20 border-emerald-400/40 text-emerald-200'
                              : 'bg-amber-500/20 border-amber-400/40 text-amber-200'
                          }`}
                          title="Klik untuk sinkronkan paksa ke Cloud Firestore"
                        >
                          <span>{cloudSyncStatus === 'synced' ? '☁️ Cloud Sinkron' : '⚠️ Sync Cloud'}</span>
                        </button>
                      )}

                      <button
                        onClick={handleOpenAdminButton}
                        className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border transition-all flex items-center gap-1.5 ${
                          isAdminUnlocked
                            ? 'bg-emerald-500/20 border-emerald-400/40 text-emerald-200 hover:bg-emerald-500/30'
                            : 'bg-white/10 border-white/20 text-indigo-100 hover:bg-white/20'
                        }`}
                      >
                        <span>{isAdminUnlocked ? '🔓 Admin' : '🔒 Admin'}</span>
                      </button>

                      {isAdminUnlocked && (
                        <button
                          onClick={openUploadModalForCurrentFilter}
                          className="px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 shadow-md hover:brightness-105"
                        >
                          + Upload PDF Kisi-Kisi
                        </button>
                      )}
                    </>
                  )}
                </div>
              </div>
            </header>

            {/* CLOUD FIRESTORE ERROR NOTICE (HANYA MUNCUL JIKA ADMIN AKTIF) */}
            {isAdminUnlocked && cloudSyncErrorDetail && (
              <div className="max-w-6xl mx-auto px-4 pt-4">
                <div className="p-3.5 rounded-2xl bg-rose-950/80 border border-rose-400/40 text-rose-100 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <strong className="text-amber-300">⚠️ Info Cloud Firestore:</strong>{' '}
                    <span>{cloudSyncErrorDetail}</span>

                  <button

              </div>

            {/* TOAST */}
            {toastMessage && (
              <div className="fixed bottom-16 right-5 z-50">
                <div
                  className={`px-4 py-3 rounded-2xl shadow-xl font-bold text-sm text-white border border-white/20 ${
                    toastMessage.type === 'success'
                      ? 'bg-emerald-600'
                      : toastMessage.type === 'warning'
                      ? 'bg-amber-600'
                      : 'bg-indigo-600'
                  }`}
                >
                  {toastMessage.msg}
                </div>
              </div>
            )}

            {/* ================================================================
                VIEW 1: BERANDA BANK SOAL PER KELAS & SEMESTER
               ================================================================ */}
            {activeView === 'library' && (
              <main className="max-w-6xl mx-auto px-4 pt-6 space-y-6">
                {/* Banner Utama */}
                <div className="bg-white/10 backdrop-blur-md rounded-3xl border border-white/15 shadow-xl p-6 sm:p-7 flex flex-col md:flex-row items-start md:items-center justify-between gap-5">
                  <div className="space-y-1.5">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/30 text-xs font-extrabold">
                      ✨ Belajar Ceria Berbasis Kisi-Kisi Sekolah
                    </span>
                    <h2 className="text-xl sm:text-2xl font-extrabold text-white">
                      Pilih Kelas & Semester untuk Mulai Latihan!
                    </h2>
                    <p className="text-sm text-indigo-100/90 max-w-2xl">
                      {isAdminUnlocked
                        ? 'Mode Admin aktif! Unggah file PDF Kisi-Kisi untuk Kelas 1 – 6 SD, otomatis tersinkron ke semua perangkat (PC & iPad).'
                        : 'Pilih jenjang kelas dan semester di bawah ini untuk langsung mengerjakan latihan soal.'}
                    </p>
                  </div>

                  {isAdminUnlocked && (
                    <button
                      onClick={openUploadModalForCurrentFilter}
                      className="w-full md:w-auto shrink-0 px-5 py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-extrabold text-sm shadow-lg hover:brightness-105"
                    >
                      📄 + Upload PDF Kisi-Kisi Baru
                    </button>

                </div>

                {/* Filter Kelas 1-6 & Semester 1-2 */}
                <div className="bg-white/10 backdrop-blur-md rounded-3xl border border-white/15 shadow-xl p-5 space-y-5">
                  <div>
                    <span className="text-xs font-extrabold uppercase tracking-wider text-indigo-200 block mb-2.5">
                      1. Pilih Jenjang Kelas SD:
                    </span>
                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-2.5">
                      {[1, 2, 3, 4, 5, 6].map((gradeNum) => {
                        const isActive = selectedGrade === gradeNum;
                        const countInGrade = packages.filter(
                          (p) => Number(p.grade) === gradeNum

                          <button
                            key={gradeNum}
                            type="button"
                            onClick={() => setSelectedGrade(gradeNum)}
                            className={`py-3 px-3 rounded-2xl border font-extrabold text-sm transition-all flex flex-col items-center ${
                              isActive
                                ? 'bg-gradient-to-br from-amber-400 to-orange-500 border-amber-300 text-slate-950 shadow-lg scale-[1.02]'
                                : 'bg-white/5 border-white/15 text-white hover:bg-white/15'

                          >
                            <span>Kelas {gradeNum}</span>
                            <span
                              className={`text-[11px] font-bold ${

                              }`}

                              {countInGrade} Paket
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="pt-3 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <span className="text-xs font-extrabold uppercase tracking-wider text-indigo-200 block mb-2">

                      </span>
                      <div className="inline-flex p-1.5 rounded-2xl bg-slate-950/40 border border-white/10">
                        {[
                          { val: 1, label: '📅 Semester 1 (Ganjil)' },

                        ].map((sem) => (
                          <button

                              selectedSemester === sem.val

                                : 'text-indigo-200 hover:text-white'

                          >
                            {sem.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="text-xs sm:text-sm font-bold text-amber-200 bg-amber-400/15 border border-amber-300/30 px-4 py-2.5 rounded-2xl">
                      Menampilkan:{' '}
                      <span className="text-white font-extrabold">
                        Kelas {selectedGrade} SD • Semester {selectedSemester}

                      ({filteredPackages.length} Paket)
                    </div>
                  </div>
                </div>

                {/* Daftar Kartu Paket Soal */}
                {filteredPackages.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {filteredPackages.map((pkg) => {
                      const pgCount = pkg.questions.filter((q) => q.type === 'pg').length;
                      const essayCount = pkg.questions.filter((q) => q.type === 'essay').length;
                      const hasVariation =
                        Array.isArray(pkg.variationQuestions) && pkg.variationQuestions.length > 0;

                      return (
                        <div
                          key={pkg.id}
                          className="bg-white text-slate-800 rounded-3xl border-2 border-white/80 shadow-xl p-5 sm:p-6 flex flex-col justify-between gap-4"
                        >
                          <div>
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="px-3 py-1 rounded-xl bg-indigo-100 text-indigo-800 font-extrabold text-xs">
                                  {pkg.subject}
                                </span>
                                <span className="px-2.5 py-1 rounded-xl bg-sky-50 text-sky-700 border border-sky-200 font-bold text-xs">
                                  Kls {pkg.grade} • Sem {pkg.semester}
                                </span>
                                {hasVariation && (

                        if (isUnsure) btnStyle = 'bg-amber-400 border-amber-500 text-slate-900';
                        else if (isAnswered) btnStyle = 'bg-indigo-600 border-indigo-600 text-white';

                        return (
                          <button
                            key={q.id}
                            type="button"
                            onClick={() => setCurrentIdx(idx)}
                            className={`h-9 sm:h-11 rounded-lg sm:rounded-xl font-extrabold text-xs sm:text-sm border-2 transition-all ${btnStyle} ${
                              isCurrent ? 'ring-4 ring-amber-300 scale-105' : ''

                  </aside>

                        <strong>⚠️ Awas Jebakan:</strong> {item.trapWarning}
                      </div>
                    </div>
                  ))}
                </div>

            {/* ================================================================
                MODAL PILIHAN VERSI LATIHAN (SOAL LAMA vs SOAL BARU)
               ================================================================ */}

              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">

                              {isGeneratingVariation
                                ? '⏳ Meracik Soal Baru...'
                                : '✨ Buat & Mulai Soal Baru (AI Remix)'}
                            </span>
                            <span className="text-xs font-semibold text-indigo-100">
                              Generate variasi soal segar dari kisi-kisi yang sama (Admin)
                            </span>
                          </div>
                          <span className="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 text-xs font-extrabold shrink-0">
                            {isGeneratingVariation ? 'Proses...' : 'Buat ✨'}
                          </span>
                        </button>
                      )
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ================================================================
                MODAL LOGIN ADMIN
               ================================================================ */}
            {showAdminLoginModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-7 border-2 border-indigo-100 shadow-2xl space-y-5">
                  <div className="flex items-start justify-between">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900">
                        {showResetPwdMode ? '🔑 Reset Password Admin' : '🔒 Masuk Mode Admin'}
                      </h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        {showResetPwdMode
                          ? 'Gunakan kode pemulihan master untuk membuat password baru.'
                          : 'Masukkan password Admin untuk mengelola bank soal & pengaturan.'}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowAdminLoginModal(false)}
                      className="text-slate-400 hover:text-slate-700 font-extrabold text-lg"
                    >
                      ✕
                    </button>
                  </div>

                  {loginErrorMsg && (
                    <div className="p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold">
                      ⚠️ {loginErrorMsg}
                    </div>
                  )}

                  {!showResetPwdMode ? (
                    <form onSubmit={handleSubmitAdminLogin} className="space-y-4">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1.5">
                          Password Admin
                        </label>
                        <input
                          type="password"
                          autoFocus
                          value={loginPasswordInput}
                          onChange={(e) => setLoginPasswordInput(e.target.value)}
                          placeholder="Masukkan password..."
                          className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold"
                          required
                        />
                      </div>

                      <div className="flex items-center justify-between">
                        <button
                          type="button"
                          onClick={() => {
                            setShowResetPwdMode(true);
                            setLoginErrorMsg('');
                          }}
                          className="text-xs font-bold text-indigo-600 hover:underline"
                        >
                          Lupa password? Reset di sini
                        </button>
                      </div>

                      <div className="flex justify-end gap-2.5 pt-2">
                        <button
                          type="button"
                          onClick={() => setShowAdminLoginModal(false)}
                          className="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm text-slate-600"
                        >
                          Batal
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow-md"
                        >
                          Buka Mode Admin
                        </button>
                      </div>
                    </form>
                  ) : (
                    <form onSubmit={handleResetPasswordWithRecovery} className="space-y-4">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1.5">
                          Kode Pemulihan Master
                        </label>
                        <input
                          type="text"
                          value={recoveryCodeInput}
                          onChange={(e) => setRecoveryCodeInput(e.target.value)}
                          placeholder="Masukkan kode pemulihan..."
                          className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1.5">
                          Password Admin Baru
                        </label>
                        <input
                          type="password"
                          value={resetNewPwdInput}
                          onChange={(e) => setResetNewPwdInput(e.target.value)}
                          placeholder="Minimal 4 karakter"
                          className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold"
                          required
                        />
                      </div>
                      <div className="flex justify-between items-center pt-2">
                        <button
                          type="button"
                          onClick={() => {
                            setShowResetPwdMode(false);
                            setLoginErrorMsg('');
                          }}
                          className="text-xs font-bold text-slate-500 hover:underline"
                        >
                          ← Kembali ke Login
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm shadow-md"
                        >
                          Simpan Password Baru
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {/* ================================================================
                MODAL PENGATURAN ADMIN (API KEY & GANTI PASSWORD)
               ================================================================ */}
            {showSettingsModal && isAdminUnlocked && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                <div className="bg-white text-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-7 border-2 border-indigo-100 shadow-2xl space-y-5 my-auto">
                  <div className="flex items-start justify-between">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900">
                        🔓 Pengaturan Mode Admin
                      </h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Atur Gemini API Key untuk generator soal AI & ubah password Admin.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowSettingsModal(false)}
                      className="text-slate-400 hover:text-slate-700 font-extrabold text-lg"
                    >
                      ✕
                    </button>
                  </div>

                  {pwdChangeMessage && (
                    <div
                      className={`p-3 rounded-2xl text-xs font-bold border ${
                        pwdChangeMessage.type === 'error'
                          ? 'bg-rose-50 border-rose-200 text-rose-700'
                          : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                      }`}
                    >
                      {pwdChangeMessage.text}
                    </div>
                  )}

                  <form onSubmit={handleSaveSettings} autoComplete="off" className="space-y-4">
                    <div>
                      <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1.5">
                        Gemini API Key (Google AI Studio)
                      </label>
                      <div className="relative flex items-center">
                        <input
                          type="text"
                          name="jk_gemini_apikey_field"
                          autoComplete="off"
                          autoCorrect="off"
                          autoCapitalize="off"
                          spellCheck="false"
                          value={tempApiKeyInput}
                          onChange={(e) => setTempApiKeyInput(e.target.value)}
                          placeholder="AIzaSy..."
                          style={showApiKeyPlain ? {} : { WebkitTextSecurity: 'disc' }}
                          className="w-full pl-4 pr-12 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold"
                        />
                        <button
                          type="button"
                          onClick={() => setShowApiKeyPlain((prev) => !prev)}
                          className="absolute right-3 px-2 py-1 text-xs font-extrabold text-slate-500 hover:text-indigo-600"
                          title={showApiKeyPlain ? 'Sembunyikan API Key' : 'Tampilkan API Key'}
                        >
                          {showApiKeyPlain ? '🙈' : '👁️'}
                        </button>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-100 space-y-3">
                      <span className="text-xs font-extrabold uppercase text-indigo-700 block">
                        Ganti Password Admin (Opsional)
                      </span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input
                          type="password"
                          name="jk_new_admin_pwd"
                          autoComplete="new-password"
                          value={newAdminPwdInput}
                          onChange={(e) => setNewAdminPwdInput(e.target.value)}
                          placeholder="Password baru..."
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold"
                        />
                        <input
                          type="password"
                          name="jk_confirm_admin_pwd"
                          autoComplete="new-password"
                          value={confirmAdminPwdInput}
                          onChange={(e) => setConfirmAdminPwdInput(e.target.value)}
                          placeholder="Ulangi password baru..."
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold"
                        />
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                      <button
                        type="button"
                        onClick={handleLockAdmin}
                        className="px-4 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-extrabold text-xs hover:bg-rose-100"
                      >
                        🔒 Kunci Mode Admin
                      </button>

                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setShowSettingsModal(false)}
                          className="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm text-slate-600"
                        >
                          Batal
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow-md"
                        >
                          Simpan Pengaturan
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ================================================================
                MODAL UPLOAD PDF KISI-KISI & GENERATOR SOAL (KHUSUS ADMIN)
               ================================================================ */}
            {showUploadModal && isAdminUnlocked && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
                <div className="bg-white text-slate-800 rounded-3xl max-w-3xl w-full p-5 sm:p-8 border-2 border-indigo-100 shadow-2xl my-auto max-h-[92vh] overflow-y-auto">
                  <div className="flex items-start justify-between gap-4 pb-4 mb-5 border-b border-slate-100">
                    <div>
                      <h2 className="text-lg sm:text-xl font-extrabold text-slate-900">
                        📄 Upload PDF Kisi-Kisi & Buat Soal AI
                      </h2>
                      <p className="text-xs sm:text-sm text-slate-500">
                        Otomatis tersimpan ke perangkat ini & Cloud Firestore iPad.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => !isGenerating && setShowUploadModal(false)}
                      className="p-2 text-slate-400 hover:text-slate-700 font-extrabold text-lg"
                    >
                      ✕
                    </button>
                  </div>

                  {generatorError && (
                    <div className="mb-4 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs sm:text-sm font-semibold">
                      ⚠️ {generatorError}
                    </div>
                  )}

                  <form onSubmit={handleGenerateAndSavePackage} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Simpan ke Kelas
                        </label>
                        <select
                          value={genGrade}
                          onChange={(e) => setGenGrade(Number(e.target.value))}
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-sm"
                        >
                          {[1, 2, 3, 4, 5, 6].map((g) => (
                            <option key={g} value={g}>
                              Kelas {g} SD
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Simpan ke Semester
                        </label>
                        <select
                          value={genSemester}
                          onChange={(e) => setGenSemester(Number(e.target.value))}
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-sm"
                        >
                          <option value={1}>Semester 1 (Ganjil)</option>
                          <option value={2}>Semester 2 (Genap)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Mata Pelajaran
                        </label>
                        <input
                          type="text"
                          value={genSubject}
                          onChange={(e) => setGenSubject(e.target.value)}
                          placeholder="Contoh: Matematika, IPAS, Bahasa Inggris"
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-sm"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Judul Paket Latihan
                        </label>
                        <input
                          type="text"
                          value={genTitle}
                          onChange={(e) => setGenTitle(e.target.value)}
                          placeholder="Contoh: Latihan ASAS Bab 1 - 4"
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-sm"
                          required
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3.5">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Jumlah Pilihan Ganda
                        </label>
                        <input
                          type="text"
                          inputMode="numeric"
                          pattern="[0-9]*"
                          value={genPgCount}
                          onChange={(e) => {
                            const digitsOnly = e.target.value.replace(/\D/g, '');
                            setGenPgCount(digitsOnly);
                          }}
                          onBlur={() => {
                            const num = parseInt(genPgCount, 10);
                            if (isNaN(num) || num < 1) setGenPgCount('1');
                            else if (num > 20) setGenPgCount('20');
                            else setGenPgCount(String(num));
                          }}
                          placeholder="1 - 20"
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-extrabold text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Jumlah Soal Esai
                        </label>
                        <input
                          type="text"
                          inputMode="numeric"
                          pattern="[0-9]*"
                          value={genEssayCount}
                          onChange={(e) => {
                            const digitsOnly = e.target.value.replace(/\D/g, '');
                            setGenEssayCount(digitsOnly);
                          }}
                          onBlur={() => {
                            const num = parseInt(genEssayCount, 10);
                            if (isNaN(num) || num < 0) setGenEssayCount('0');
                            else if (num > 15) setGenEssayCount('15');
                            else setGenEssayCount(String(num));
                          }}
                          placeholder="0 - 15"
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-extrabold text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-extrabold uppercase text-slate-600">
                          Sumber Kisi-Kisi:
                        </span>
                        <div className="inline-flex p-1 rounded-xl bg-slate-100 text-xs font-bold">
                          <button
                            type="button"
                            onClick={() => setInputMode('pdf')}
                            className={`px-3 py-1 rounded-lg ${
                              inputMode === 'pdf' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                            }`}
                          >
                            Upload PDF
                          </button>
                          <button
                            type="button"
                            onClick={() => setInputMode('manual')}
                            className={`px-3 py-1 rounded-lg ${
                              inputMode === 'manual' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                            }`}
                          >
                            Tempel Teks
                          </button>
                        </div>
                      </div>

                      {inputMode === 'pdf' ? (
                        <div className="space-y-3">
                          <div
                            onClick={() => fileInputRef.current?.click()}
                            className="border-2 border-dashed border-indigo-300 bg-indigo-50/40 rounded-2xl p-6 text-center cursor-pointer"
                          >
                            <input
                              ref={fileInputRef}
                              type="file"
                              accept=".pdf,application/pdf"
                              onChange={(e) => handlePdfFileSelected(e.target.files?.[0])}
                              className="hidden"
                            />
                            {isExtractingPdf ? (
                              <div className="font-extrabold text-sm text-indigo-700">
                                ⏳ Membaca dokumen PDF...
                              </div>
                            ) : uploadedPdfName ? (
                              <div>
                                <p className="font-extrabold text-sm text-slate-900">
                                  📄 {uploadedPdfName}
                                </p>
                                <span className="text-xs font-bold text-emerald-700">
                                  ✓ {uploadedPdfPages} Halaman Berhasil Diekstrak
                                </span>
                              </div>
                            ) : (
                              <div>
                                <p className="font-extrabold text-sm text-slate-800">
                                  Klik untuk pilih file PDF Kisi-Kisi
                                </p>
                                <p className="text-xs text-slate-500">Format file .pdf</p>
                              </div>
                            )}
                          </div>
                          {kisiKisiText && (
                            <textarea
                              rows={4}
                              value={kisiKisiText}
                              onChange={(e) => setKisiKisiText(e.target.value)}
                              className="w-full p-3 rounded-xl border border-slate-200 text-xs bg-slate-50"
                            />
                          )}
                        </div>
                      ) : (
                        <textarea
                          rows={5}
                          value={kisiKisiText}
                          onChange={(e) => setKisiKisiText(e.target.value)}
                          placeholder="Tempelkan teks kisi-kisi di sini..."
                          className="w-full p-3.5 rounded-2xl border-2 border-slate-200 text-xs sm:text-sm"
                        />
                      )}
                    </div>

                    <div className="pt-3 border-t border-slate-100 flex justify-end gap-3">
                      <button
                        type="button"
                        disabled={isGenerating}
                        onClick={() => setShowUploadModal(false)}
                        className="px-5 py-3 rounded-2xl border-2 border-slate-200 font-bold text-sm text-slate-600"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        disabled={isGenerating || isExtractingPdf}
                        className="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-sm shadow-lg"
                      >
                        {isGenerating ? '⏳ Meracik Soal...' : '✨ Generate & Simpan Soal'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL KONFIRMASI HAPUS */}
            {packageToDelete && isAdminUnlocked && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 border-2 border-rose-100 shadow-2xl text-center">
                  <h3 className="text-lg font-extrabold text-slate-900 mb-2">Hapus Paket Soal Ini?</h3>
                  <p className="text-sm text-slate-600 mb-5">
                    Paket <strong>"{packageToDelete.title}"</strong> akan dihapus dari Kelas{' '}
                    {packageToDelete.grade} Semester {packageToDelete.semester}.
                  </p>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setPackageToDelete(null)}
                      className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm text-slate-700"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmDeletePackage}
                      className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-sm"
                    >
                      Ya, Hapus
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL KONFIRMASI KUMPULKAN */}
            {showSubmitConfirm && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-7 border-2 border-sky-100 shadow-2xl text-center">
                  <div className="text-4xl mb-3">✅</div>
                  <h3 className="text-xl font-extrabold text-slate-900 mb-2">
                    Sudah Yakin Ingin Mengumpulkan?
                  </h3>
                  <p className="text-sm text-slate-600 mb-5 leading-relaxed">
                    Kamu sudah menjawab <strong>{answeredCount}</strong> dari{' '}
                    <strong>{activePackage.questions.length}</strong> soal
                    {unsureCount > 0 ? ` (masih ada ${unsureCount} soal ditandai ragu-ragu)` : ''}.
                    Yuk cek hasilnya sekarang!
                  </p>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setShowSubmitConfirm(false)}
                      className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm text-slate-700 hover:bg-slate-100"
                    >
                      Cek Lagi
                    </button>
                    <button
                      type="button"
                      onClick={handleFinalizeAndGradeExam}
                      className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md"
                    >
                      Ya, Kumpulkan!
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* LOADING OVERLAY SAAT MENGOREKSI */}
            {isGrading && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-sm w-full p-7 border-2 border-indigo-100 shadow-2xl text-center">
                  <div className="text-4xl animate-spin mb-4">⏳</div>
                  <h3 className="text-lg font-extrabold text-slate-900 mb-1.5">
                    Sebentar Ya, Sedang Mengoreksi...
                  </h3>
                  <p className="text-sm text-slate-600">
                    Kakak AI sedang memeriksa jawaban Pilihan Ganda dan Esaimu dengan teliti! ✨
                  </p>
                </div>
              </div>
            )}
          </div>

          <footer className="py-5 px-4 text-center text-xs font-bold text-indigo-200/75 border-t border-white/10 bg-[#12132e]/80 backdrop-blur-md">
            Copyright Tommydomeh 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
