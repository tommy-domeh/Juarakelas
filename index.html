    // =========================================================================
    // HELPER: EKSTRAK TEKS DARI FILE PDF
    // =========================================================================
    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) {
        throw new Error('Library pembaca PDF belum termuat. Periksa koneksi internet.');
      }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = pdf.numPages;
      let fullText = '';

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageStrings = textContent.items.map((item) => item.str);
        fullText += `\n--- Halaman ${pageNum} ---\n` + pageStrings.join(' ');
      }

      return {
        text: fullText.trim(),
        numPages: totalPages
      };
    }

    // =========================================================================
    // HELPER: CALL GEMINI API DENGAN AUTO-FALLBACK MODEL TERBARU
    // =========================================================================
    async function fetchGeminiWithRetry(apiKey, payload, maxRetries = 2) {
      const candidateModels = [
        'gemini-3-flash-preview',
        'gemini-2.5-flash-preview-09-2025',
        'gemini-2.0-flash'
      ];

      let lastError = null;

      for (const modelName of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
        let delay = 1000;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              const errMsg = errData?.error?.message || `HTTP ${response.status}`;

              if (
                response.status === 404 ||
                errMsg.toLowerCase().includes('no longer available') ||
                errMsg.toLowerCase().includes('not found') ||
                errMsg.toLowerCase().includes('not supported')
              ) {
                lastError = new Error(errMsg);
                break;
              }

              if (response.status === 429 || response.status >= 500) {
                throw new Error(errMsg);
              }
              throw new Error(errMsg);
            }

            return await response.json();
          } catch (err) {
            lastError = err;
            if (attempt === maxRetries) break;
            await new Promise((resolve) => setTimeout(resolve, delay));
            delay *= 2;
          }
        }
      }

      throw lastError || new Error('Gagal menghubungi Gemini AI.');
    }

      const handleGenerateAndSavePackage = async (e) => {

- Untuk Pilihan Ganda ("pg"), isi 4 opsi ("A", "B", "C", "D") dan tentukan "correctAnswer".
- Untuk Esai ("essay"), kosongkan array "options" ([]), isi "correctAnswer" dan "sampleAnswer".
- Field "explanation" (pembahasan langkah demi langkah) dan "trapWarning" (tips awas jebakan) wajib ramah anak dalam Bahasa Indonesia.`;

        const userQuery = `Mata Pelajaran: ${finalSubject}\nJenjang: Kelas ${genGrade} SD - Semester ${genSemester}\n\nISI KISI-KISI:\n${kisiKisiText.slice(0, 28000)}`;

        const payload = {

      const handleGenerateVariationFromPackage = async (sourcePkg) => {
        if (!isAdminUnlocked) {
          triggerToast('Buka Menu Admin terlebih dahulu untuk membuat soal baru!', 'warning');
          return;
        }
        if (sourcePkg.bestScore === null || sourcePkg.bestScore === undefined) {

          triggerToast('Fitur Soal Variasi Baru butuh Gemini API Key di Menu Admin.', 'warning');
          return;
        }

        setIsRemixingPackageId(sourcePkg.id);
        triggerToast('Meracik soal variasi baru sesuai kisi-kisi paket ini...', 'info');

        const pgCount = Math.max(1, sourcePkg.questions.filter((q) => q.type === 'pg').length);
        const essayCount = sourcePkg.questions.filter((q) => q.type === 'essay').length;

        const referenceOutline = sourcePkg.questions
          .map(
            (q, i) =>
              `${i + 1}. [${q.type.toUpperCase()}] Topik: ${q.unit} | Contoh pola soal: ${q.question}`
          )
          .join('\n');

        const systemPrompt = `Kamu adalah Guru SD profesional di Indonesia untuk aplikasi "Juara Kelas".
Tugasmu membuat 1 SET SOAL VARIASI BARU (AI Remix) dari paket soal yang sudah pernah dikerjakan siswa Kelas ${sourcePkg.grade} SD (Semester ${sourcePkg.semester}, Mapel: ${sourcePkg.subject}).
Aturan wajib:
1. Buat tepat ${pgCount} soal Pilihan Ganda (type: "pg") dan ${essayCount} soal Esai (type: "essay").
2. UBAH cerita, nama tokoh, angka, benda, atau kalimat pertanyaannya sehingga benar-benar baru dan segar (siswa tidak bisa sekadar menghafal kunci jawaban lama), namun tetap menguji indikator & unit kompetensi yang sama persis!
3. Sesuaikan tingkat kesulitan untuk Kelas ${sourcePkg.grade} SD.
4. Field "explanation" (pembahasan langkah demi langkah) dan "trapWarning" (tips awas jebakan) wajib dalam Bahasa Indonesia yang ramah anak.
5. Jika butuh ilustrasi, isi "visualEmoji" dan "visualCaption"; jika tidak, isi "".`;

        const userQuery = `Judul Paket Asal: ${sourcePkg.title}
Mata Pelajaran: ${sourcePkg.subject} | Kelas ${sourcePkg.grade} SD Semester ${sourcePkg.semester}

POLA UNIT & INDIKATOR SOAL ASAL YANG HARUS DIBUATKAN VARIASI BARUNYA:
${referenceOutline}`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                questions: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {

                      type: { type: 'STRING', enum: ['pg', 'essay'] },

                      visualEmoji: { type: 'STRING' },
                      visualCaption: { type: 'STRING' },
                      question: { type: 'STRING' },
                      options: {
                        type: 'ARRAY',
                        items: {
                          type: 'OBJECT',
                          properties: {
                            key: { type: 'STRING' },
                            text: { type: 'STRING' }
                          },
                          required: ['key', 'text']
                        }
                      },
                      correctAnswer: { type: 'STRING' },
                      sampleAnswer: { type: 'STRING' },
                      explanation: { type: 'STRING' },
                      trapWarning: { type: 'STRING' }
                    },
                    required: [
                      'id',
                      'type',
                      'unit',
                      'visualEmoji',
                      'visualCaption',
                      'question',
                      'options',
                      'correctAnswer',
                      'explanation',
                      'trapWarning'
                    ]
                  }

              },
              required: ['questions']
            }
          }

          const normalizedQuestions = parsed.questions.map((q, idx) => ({

            id: `q_var_${Date.now()}_${idx + 1}`

          const updatedParentPkg = {

          if (activePackage.id === updatedParentPkg.id) {

      const handleFinalizeAndGradeExam = async () => {
        setShowSubmitConfirm(false);
        setIsTimerRunning(false);
        setIsGrading(true);

        const diffSecs = Math.max(1, Math.round((Date.now() - quizStartTime) / 1000));
        setElapsedDurationText(`${Math.floor(diffSecs / 60)} menit ${diffSecs % 60} detik`);

        const essayQuestions = activePackage.questions.filter((q) => q.type === 'essay');
        let aiEssayEvaluations = {};

        if (essayQuestions.length > 0 && geminiApiKey) {
          try {
            const essayPayloadList = essayQuestions.map((q) => ({
              id: q.id,
              question: q.question,
              expectedAnswer: q.sampleAnswer || q.correctAnswer,
              studentAnswer: (answers[q.id] || '').trim() || '(Tidak dijawab)'
            }));

            const payload = {
              contents: [
                {
                  parts: [
                    {
                      text: `Nilai jawaban esai siswa SD berikut (skor 0-100) dengan toleransi huruf besar/kecil dan tanda baca:\n${JSON.stringify(
                        essayPayloadList
                      )}`
                    }
                  ]
                }
              ],
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      id: { type: 'STRING' },
                      score: { type: 'NUMBER' },
                      isCorrect: { type: 'BOOLEAN' },
                      feedback: { type: 'STRING' }
                    },
                    required: ['id', 'score', 'isCorrect', 'feedback']
                  }
                }
              }
            };

            const result = await fetchGeminiWithRetry(geminiApiKey, payload, 1);
            const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              JSON.parse(rawText).forEach((item) => {
                aiEssayEvaluations[item.id] = item;
              });
            }
          } catch (e) {}
        }

        essayQuestions.forEach((q) => {
          if (!aiEssayEvaluations[q.id]) {
            const cleanUser = (answers[q.id] || '').trim().toLowerCase().replace(/[.!?,]/g, '');
            const cleanExpected = (q.sampleAnswer || q.correctAnswer || '')
              .trim()
              .toLowerCase()
              .replace(/[.!?,]/g, '');
            const isExact = cleanUser.length > 0 && cleanUser === cleanExpected;
            const isPartial =
              cleanUser.length > 0 &&
              !isExact &&
              (cleanExpected.includes(cleanUser) || cleanUser.includes(cleanExpected));

            aiEssayEvaluations[q.id] = {
              id: q.id,
              score: isExact ? 100 : isPartial ? 70 : 0,
              isCorrect: isExact || isPartial,
              feedback: isExact
                ? 'Hebat sekali! Jawabanmu tepat dan sesuai kunci!'
                : isPartial
                ? 'Hampir sempurna! Cek susunan lengkapnya di pembahasan ya.'
                : 'Belum tepat, yuk baca pembahasan di bawah supaya makin paham!'
            };
          }
        });

        let accumulatedScore = 0;
        let correctCount = 0;

        const evaluatedItems = activePackage.questions.map((q, index) => {
          const userAns = (answers[q.id] || '').trim();
          if (q.type === 'pg') {
            const isCorrect = userAns.toUpperCase() === q.correctAnswer.toUpperCase();
            const itemScore = isCorrect ? 100 : 0;
            accumulatedScore += itemScore;
            if (isCorrect) correctCount += 1;

            const selectedOptObj = q.options.find((o) => o.key === userAns);
            const correctOptObj = q.options.find((o) => o.key === q.correctAnswer);

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: selectedOptObj
                ? `${selectedOptObj.key}. ${selectedOptObj.text}`
                : '(Belum dijawab)',
              correctAnswerDisplay: correctOptObj
                ? `${correctOptObj.key}. ${correctOptObj.text}`
                : q.correctAnswer,
              isCorrect,
              score: itemScore,
              aiFeedback: null
            };
          } else {
            const aiEval = aiEssayEvaluations[q.id];
            accumulatedScore += aiEval.score;
            if (aiEval.score >= 70) correctCount += 1;

            return {
              ...q,
              number: index + 1,
              userAnswerDisplay: userAns || '(Belum dijawab)',
              correctAnswerDisplay: q.sampleAnswer || q.correctAnswer,
              isCorrect: aiEval.score >= 70,
              score: aiEval.score,
              aiFeedback: aiEval.feedback
            };
          }
        });

        const finalScore = Math.round(accumulatedScore / activePackage.questions.length);
        const earnedStars = Math.max(10, Math.round(finalScore / 2));
        setXpStars((prev) => prev + earnedStars);

        const prevBest = activePackage.bestScore ?? -1;
        if (finalScore > prevBest) {
          const updatedPkg = { ...activePackage, bestScore: finalScore };
          setActivePackage(updatedPkg);
          setPackages((prev) => prev.map((p) => (p.id === updatedPkg.id ? updatedPkg : p)));
          if (!updatedPkg.isBuiltin) {
            await savePackageToCloud(updatedPkg);
          }
        }

        setGradingResults({
          finalScore,
          correctCount,
          totalQuestions: activePackage.questions.length,
          earnedStars,
          items: evaluatedItems
        });

        setIsGrading(false);
        setActiveView('results');
      };

      const filteredPackages = packages.filter(
        (pkg) => Number(pkg.grade) === selectedGrade && Number(pkg.semester) === selectedSemester
      );

      const currentQuestion = activePackage.questions[currentIdx] || activePackage.questions[0];
      const answeredCount = activePackage.questions.filter(
        (q) => answers[q.id] && answers[q.id].trim().length > 0

                          onChange={(e) => setGenTitle(e.target.value)}
                          placeholder="Contoh: Latihan ASAS Bab 1 - 4"
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-sm"
                          required
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3.5">
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Jumlah Pilihan Ganda
                        </label>
                        <input
                          type="number"
                          min={3}
                          max={15}
                          value={genPgCount}
                          onChange={(e) => setGenPgCount(Number(e.target.value))}
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-extrabold text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">
                          Jumlah Soal Esai
                        </label>
                        <input
                          type="number"
                          min={1}
                          max={10}
                          value={genEssayCount}
                          onChange={(e) => setGenEssayCount(Number(e.target.value))}
                          className="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 font-extrabold text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-extrabold uppercase text-slate-600">
                          Sumber Kisi-Kisi:
                        </span>
                        <div className="inline-flex p-1 rounded-xl bg-slate-100 text-xs font-bold">
                          <button
                            type="button"
                            onClick={() => setInputMode('pdf')}
                            className={`px-3 py-1 rounded-lg ${
                              inputMode === 'pdf' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                            }`}
                          >
                            Upload PDF
                          </button>
                          <button
                            type="button"
                            onClick={() => setInputMode('manual')}
                            className={`px-3 py-1 rounded-lg ${
                              inputMode === 'manual' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                            }`}
                          >
                            Tempel Teks
                          </button>
                        </div>
                      </div>

                      {inputMode === 'pdf' ? (
                        <div className="space-y-3">
                          <div
                            onClick={() => fileInputRef.current?.click()}
                            className="border-2 border-dashed border-indigo-300 bg-indigo-50/40 rounded-2xl p-6 text-center cursor-pointer"
                          >
                            <input
                              ref={fileInputRef}
                              type="file"
                              accept=".pdf,application/pdf"
                              onChange={(e) => handlePdfFileSelected(e.target.files?.[0])}
                              className="hidden"
                            />
                            {isExtractingPdf ? (
                              <div className="font-extrabold text-sm text-indigo-700">
                                ⏳ Membaca dokumen PDF...
                              </div>
                            ) : uploadedPdfName ? (
                              <div>
                                <p className="font-extrabold text-sm text-slate-900">
                                  📄 {uploadedPdfName}
                                </p>
                                <span className="text-xs font-bold text-emerald-700">
                                  ✓ {uploadedPdfPages} Halaman Berhasil Diekstrak
                                </span>
                              </div>
                            ) : (
                              <div>
                                <p className="font-extrabold text-sm text-slate-800">
                                  Klik untuk pilih file PDF Kisi-Kisi
                                </p>
                                <p className="text-xs text-slate-500">Format file .pdf</p>
                              </div>
                            )}
                          </div>
                          {kisiKisiText && (
                            <textarea
                              rows={4}
                              value={kisiKisiText}
                              onChange={(e) => setKisiKisiText(e.target.value)}
                              className="w-full p-3 rounded-xl border border-slate-200 text-xs bg-slate-50"
                            />
                          )}
                        </div>
                      ) : (
                        <textarea
                          rows={5}
                          value={kisiKisiText}
                          onChange={(e) => setKisiKisiText(e.target.value)}
                          placeholder="Tempelkan teks kisi-kisi di sini..."
                          className="w-full p-3.5 rounded-2xl border-2 border-slate-200 text-xs sm:text-sm"
                        />
                      )}
                    </div>

                    <div className="pt-3 border-t border-slate-100 flex justify-end gap-3">
                      <button
                        type="button"
                        disabled={isGenerating}
                        onClick={() => setShowUploadModal(false)}
                        className="px-5 py-3 rounded-2xl border-2 border-slate-200 font-bold text-sm text-slate-600"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        disabled={isGenerating || isExtractingPdf}
                        className="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-sm shadow-lg"
                      >
                        {isGenerating ? '⏳ Meracik Soal...' : '✨ Generate & Simpan Soal'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL KONFIRMASI HAPUS */}
            {packageToDelete && isAdminUnlocked && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 border-2 border-rose-100 shadow-2xl text-center">
                  <h3 className="text-lg font-extrabold text-slate-900 mb-2">Hapus Paket Soal Ini?</h3>
                  <p className="text-sm text-slate-600 mb-5">
                    Paket <strong>"{packageToDelete.title}"</strong> akan dihapus dari Kelas{' '}
                    {packageToDelete.grade} Semester {packageToDelete.semester}.
                  </p>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setPackageToDelete(null)}
                      className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm text-slate-700"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmDeletePackage}
                      className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-sm"
                    >
                      Ya, Hapus
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL KONFIRMASI KUMPULKAN */}
            {showSubmitConfirm && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-7 border-2 border-sky-100 shadow-2xl text-center">
                  <div className="text-4xl mb-3">✅</div>
                  <h3 className="text-xl font-extrabold text-slate-900 mb-2">
                    Sudah Yakin Ingin Mengumpulkan?
                  </h3>
                  <p className="text-sm text-slate-600 mb-5 leading-relaxed">
                    Kamu sudah menjawab <strong>{answeredCount}</strong> dari{' '}
                    <strong>{activePackage.questions.length}</strong> soal
                    {unsureCount > 0 ? ` (masih ada ${unsureCount} soal ditandai ragu-ragu)` : ''}.
                    Yuk cek hasilnya sekarang!
                  </p>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setShowSubmitConfirm(false)}
                      className="flex-1 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm text-slate-700 hover:bg-slate-100"
                    >
                      Cek Lagi
                    </button>
                    <button
                      type="button"
                      onClick={handleFinalizeAndGradeExam}
                      className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md"
                    >
                      Ya, Kumpulkan!
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* LOADING OVERLAY SAAT MENGOREKSI */}
            {isGrading && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-white text-slate-800 rounded-3xl max-w-sm w-full p-7 border-2 border-indigo-100 shadow-2xl text-center">
                  <div className="text-4xl animate-spin mb-4">⏳</div>
                  <h3 className="text-lg font-extrabold text-slate-900 mb-1.5">
                    Sebentar Ya, Sedang Mengoreksi...
                  </h3>
                  <p className="text-sm text-slate-600">
                    Kakak AI sedang memeriksa jawaban Pilihan Ganda dan Esaimu dengan teliti! ✨
                  </p>
                </div>
              </div>
            )}
          </div>

          <footer className="py-5 px-4 text-center text-xs font-bold text-indigo-200/75 border-t border-white/10 bg-[#12132e]/80 backdrop-blur-md">
            Copyright Tommydomeh 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
